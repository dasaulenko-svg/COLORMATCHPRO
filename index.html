<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ColorMatch PRO</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #2e7d32;
            --accent-yellow: #f57f17;
            --accent-red: #c62828;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 600px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            box-sizing: border-box;
            border-bottom: 1px solid var(--border-color);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
        }

        .mode-toggle {
            display: flex;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 2px;
        }

        .mode-btn {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
        }

        .mode-btn.active {
            background: #444444;
            color: var(--text-main);
            font-weight: bold;
        }

        main {
            width: 100%;
            max-width: 600px;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .viewport-box {
            position: relative;
            width: 100%;
            height: 260px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #374151;
            color: white;
        }

        .verdict-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .verdict-score {
            font-size: 48px;
            font-weight: 800;
            margin: 8px 0;
        }

        .verdict-description {
            font-size: 14px;
            line-height: 1.5;
            color: #dddddd;
            margin-top: 10px;
            text-align: left;
        }

        .pro-details {
            margin-top: 15px;
            width: 100%;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
            text-align: left;
        }

        .pro-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }

        .badge-positive {
            background: rgba(46, 125, 50, 0.2);
            color: #4caf50;
            border: 1px solid #2e7d32;
        }

        .badge-negative {
            background: rgba(198, 40, 40, 0.2);
            color: #f44336;
            border: 1px solid #c62828;
        }

        .badge-neutral {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">ColorMatch PRO</div>
        <div class="mode-toggle">
            <button id="btn-lite" class="mode-btn active" onclick="switchMode('lite')">LITE</button>
            <button id="btn-pro" class="mode-btn" onclick="switchMode('pro')">PRO</button>
        </div>
    </header>

    <main>
        <div class="viewport-box">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="startMeasurement()">СКАНИРОВАТЬ</button>
            <button class="btn btn-secondary" onclick="resetSessionState()">СБРОС</button>
        </div>

        <div class="verdict-card" id="verdict-card">
            <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Точность совпадения</div>
            <div class="verdict-score" id="verdict-score">0%</div>
            <div class="verdict-description" id="verdict-text">Нажмите «СКАНИРОВАТЬ» для начала измерения.</div>

            <!-- PRO Mode: Вывод поправок, штрафов и бонусов -->
            <div class="pro-details" id="pro-details">
                <div class="pro-row">
                    <span>1D Коррекция (Среднее):</span>
                    <strong id="pro-1d">0%</strong>
                </div>
                <div class="pro-row">
                    <span>3D Коррекция (Матричная):</span>
                    <strong id="pro-3d">0%</strong>
                </div>
                <div class="pro-row">
                    <span>Разброс (1D vs 3D):</span>
                    <strong id="pro-spread">0%</strong>
                </div>
                <div class="pro-row">
                    <span>Консенсус (1D/3D):</span>
                    <span id="pro-consensus-badge" class="badge badge-neutral">0%</span>
                </div>
                <div class="pro-row">
                    <span>Оценка Камеры:</span>
                    <span id="pro-camera-badge" class="badge badge-neutral">0%</span>
                </div>
                <div class="pro-row">
                    <span>Отсев выбросов (>15%):</span>
                    <span id="pro-outliers-badge" class="badge badge-neutral">Нет</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentMode = 'lite';

        // Глобальные переменные сессии
        window.sessionData = {
            raw1D: [],
            raw3D: [],
            rawCameraScore: 0,
            finalScore: 0
        };

        // 6. Сброс состояния сессии (Reset State)
        function resetSessionState() {
            // Очистка всех накопительных данных
            window.sessionData = {
                raw1D: [],
                raw3D: [],
                rawCameraScore: 0,
                finalScore: 0
            };

            // Сброс UI
            document.getElementById('verdict-score').textContent = '0%';
            document.getElementById('verdict-score').style.color = '#ffffff';
            document.getElementById('verdict-text').innerHTML = 'Состояние сброшено. Готово к новому замеру.';

            document.getElementById('pro-1d').textContent = '0%';
            document.getElementById('pro-3d').textContent = '0%';
            document.getElementById('pro-spread').textContent = '0%';
            
            const conBadge = document.getElementById('pro-consensus-badge');
            conBadge.className = 'badge badge-neutral';
            conBadge.textContent = '0%';

            const camBadge = document.getElementById('pro-camera-badge');
            camBadge.className = 'badge badge-neutral';
            camBadge.textContent = '0%';

            const outBadge = document.getElementById('pro-outliers-badge');
            outBadge.className = 'badge badge-neutral';
            outBadge.textContent = 'Нет';
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-lite').classList.toggle('active', mode === 'lite');
            document.getElementById('btn-pro').classList.toggle('active', mode === 'pro');
            document.getElementById('pro-details').style.display = (mode === 'pro') ? 'flex' : 'none';
        }

        async function startMeasurement() {
            // Обязательный полный сброс перед новым замером
            resetSessionState();

            document.getElementById('verdict-text').innerHTML = '⏳ Получение данных и расчёт на сервере...';

            // Имитация сбора сырых патчей кадра
            const payload = {
                standard: { r: 120, g: 150, b: 200 },
                sample: { r: 122, g: 148, b: 198 },
                rawCameraScore: 94,
                methods1D: [89, 93, 91, 90],
                methods3D: [88, 92, 90, 89]
            };

            try {
                // Отправка данных на Vercel API
                const response = await fetch('/api/calibrate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Ошибка связи с сервером');

                const data = await response.json();
                renderVerdict(data);

            } catch (err) {
                document.getElementById('verdict-text').innerHTML = `<span style="color: var(--accent-red)">❌ Ошибка: ${err.message}</span>`;
            }
        }

        function renderVerdict(data) {
            const { finalPercent, verdictHTML, details } = data;

            // 1. Отображение итогового балла
            const scoreElem = document.getElementById('verdict-score');
            scoreElem.textContent = `${finalPercent}%`;

            if (finalPercent >= 90) scoreElem.style.color = '#4caf50';
            else if (finalPercent >= 64) scoreElem.style.color = '#ffb74d';
            else scoreElem.style.color = '#f44336';

            // 2. Подпись вердикта
            document.getElementById('verdict-text').innerHTML = verdictHTML;

            // 3. Заполнение Pro-деталей (значки и мелкие цифры бонусов/штрафов)
            document.getElementById('pro-1d').textContent = `${details.score1D}%`;
            document.getElementById('pro-3d').textContent = `${details.score3D}%`;
            document.getElementById('pro-spread').textContent = `${details.spread}%`;

            // Оформление плашки консенсуса
            const conBadge = document.getElementById('pro-consensus-badge');
            conBadge.textContent = details.consensusReason;
            if (details.consensusBonus > 0) conBadge.className = 'badge badge-positive';
            else if (details.consensusBonus < 0) conBadge.className = 'badge badge-negative';
            else conBadge.className = 'badge badge-neutral';

            // Оформление плашки камеры
            const camBadge = document.getElementById('pro-camera-badge');
            camBadge.textContent = details.cameraReason;
            if (details.cameraBonus > 0) camBadge.className = 'badge badge-positive';
            else if (details.cameraBonus < 0) camBadge.className = 'badge badge-negative';
            else camBadge.className = 'badge badge-neutral';

            // Оформление плашки выбросов
            const outBadge = document.getElementById('pro-outliers-badge');
            if (details.hasOutliers) {
                outBadge.textContent = 'Обнаружены (>15%)';
                outBadge.className = 'badge badge-negative';
            } else {
                outBadge.textContent = 'Отсутствуют';
                outBadge.className = 'badge badge-positive';
            }
        }

        // Инициализация камеры при загрузке
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('webcam').srcObject = stream;
            } catch (e) {
                console.warn('Камера недоступна:', e);
            }
        }

        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
