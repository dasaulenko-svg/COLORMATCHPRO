<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColorBank Calibration</title>
  <style>
    :root {
      --bg-color: #0b1320;
      --card-bg: #131c2e;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --accent-purple: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px 6px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-purple { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .btn-cyan { background: linear-gradient(135deg, #06b6d4, #3b82f6); }

    .preview-box {
      width: 100%;
      height: 110px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
      position: relative;
    }
    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-placeholder {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    .info-list {
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .info-list span { color: var(--text-main); font-weight: 600; }

    .result-block {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .match-val {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .match-green { color: var(--accent-green); }
    .match-red { color: var(--accent-red); }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .badge-red { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge-green { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .badge-wait { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }

    .swatch-compare {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 8px;
      width: 100%;
    }
    .swatch-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .swatch-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.1);
      background-color: #000;
    }

    /* Скрытые элементы камеры и обработки */
    input[type="file"] { display: none; }
    canvas { display: none; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- Скрытые элементы управления камерой -->
  <input type="file" id="input-ref" accept="image/*" capture="environment">
  <input type="file" id="input-sam" accept="image/*" capture="environment">
  <canvas id="process-canvas"></canvas>

  <div class="cards-grid">
    <!-- Эталон -->
    <div class="card">
      <button class="btn btn-purple" onclick="document.getElementById('input-ref').click()">📷 Снять Эталон</button>
      <div class="preview-box" id="box-ref">
        <span class="preview-placeholder">Нет снимка</span>
      </div>
      <div class="info-list">
        <div>⚪ <b>Цель:</b> <span id="ref-target">---</span></div>
        <div>⚪ Белый: <span id="ref-white">---</span></div>
        <div>⚪ Серый: <span id="ref-gray">---</span></div>
        <div>⚪ Чёрный: <span id="ref-black">---</span></div>
      </div>
    </div>

    <!-- Образец -->
    <div class="card">
      <button class="btn btn-cyan" onclick="document.getElementById('input-sam').click()">📷 Снять Образец</button>
      <div class="preview-box" id="box-sam">
        <span class="preview-placeholder">Нет снимка</span>
      </div>
      <div class="info-list">
        <div>⚪ <b>Цель:</b> <span id="sam-target">---</span></div>
        <div>⚪ Белый: <span id="sam-white">---</span></div>
        <div>⚪ Серый: <span id="sam-gray">---</span></div>
        <div>⚪ Чёрный: <span id="sam-black">---</span></div>
      </div>
    </div>
  </div>

  <!-- Блок Скорректированного совпадения (от Vercel) -->
  <div class="result-block">
    <div class="section-title">✨ СКОРРЕКТИРОВАННОЕ СОВПАДЕНИЕ (VERCEL API)</div>
    <div id="corr-match-val" class="match-val match-green">--% MATCH</div>
    <div id="corr-status-badge" class="status-badge badge-wait">СДЕЛАЙТЕ СНИМКИ</div>
    
    <div class="swatch-compare">
      <div class="swatch-item">
        <div id="corr-ref-swatch" class="swatch-circle"></div>
        <span>Эталон</span>
        <b id="corr-ref-rgb">0, 0, 0</b>
      </div>
      <span style="font-weight:700; color:var(--text-muted)">VS</span>
      <div class="swatch-item">
        <div id="corr-sam-swatch" class="swatch-circle"></div>
        <span>Образец</span>
        <b id="corr-sam-rgb">0, 0, 0</b>
      </div>
    </div>
  </div>

</div>

<script>
  // Хранилище распознанных цветов с кадров
  const state = {
    refTarget: null,
    refPatches: null,
    samTarget: null,
    samPatches: null
  };

  const canvas = document.getElementById('process-canvas');
  const ctx = canvas.getContext('2d');

  // Слушатели открытия камеры
  document.getElementById('input-ref').addEventListener('change', (e) => handleImageUpload(e, 'ref'));
  document.getElementById('input-sam').addEventListener('change', (e) => handleImageUpload(e, 'sam'));

  function handleImageUpload(event, type) {
    const file = event.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      // Отрисовываем фото во внутренний Canvas
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      // Отображаем превью в UI
      const box = document.getElementById(`box-${type}`);
      box.innerHTML = `<img src="${img.src}">`;

      // Автоматически считываем значения точки в центре кадра (Цель)
      // и предполагаемых участков (заглушка для авто-сканирования кадра)
      const centerX = Math.floor(img.width / 2);
      const centerY = Math.floor(img.height / 2);

      const targetRgb = getPixelRgb(centerX, centerY);
      const whiteRgb = getPixelRgb(Math.floor(img.width * 0.2), Math.floor(img.height * 0.2));
      const grayRgb  = getPixelRgb(Math.floor(img.width * 0.5), Math.floor(img.height * 0.2));
      const blackRgb = getPixelRgb(Math.floor(img.width * 0.8), Math.floor(img.height * 0.2));

      if (type === 'ref') {
        state.refTarget = targetRgb;
        state.refPatches = { white: whiteRgb, gray: grayRgb, black: blackRgb };

        document.getElementById('ref-target').innerText = `${targetRgb.r}, ${targetRgb.g}, ${targetRgb.b}`;
        document.getElementById('ref-white').innerText = `${whiteRgb.r}, ${whiteRgb.g}, ${whiteRgb.b}`;
        document.getElementById('ref-gray').innerText = `${grayRgb.r}, ${grayRgb.g}, ${grayRgb.b}`;
        document.getElementById('ref-black').innerText = `${blackRgb.r}, ${blackRgb.g}, ${blackRgb.b}`;
      } else {
        state.samTarget = targetRgb;
        state.samPatches = { white: whiteRgb, gray: grayRgb, black: blackRgb };

        document.getElementById('sam-target').innerText = `${targetRgb.r}, ${targetRgb.g}, ${targetRgb.b}`;
        document.getElementById('sam-white').innerText = `${whiteRgb.r}, ${whiteRgb.g}, ${whiteRgb.b}`;
        document.getElementById('sam-gray').innerText = `${grayRgb.r}, ${grayRgb.g}, ${grayRgb.b}`;
        document.getElementById('sam-black').innerText = `${blackRgb.r}, ${blackRgb.g}, ${blackRgb.b}`;
      }

      // Если сняты оба кадра — запрашиваем вердикт у Vercel
      if (state.refTarget && state.samTarget) {
        sendToVercelAPI();
      }
    };
    img.src = URL.createObjectURL(file);
  }

  function getPixelRgb(x, y) {
    const pixel = ctx.getImageData(x, y, 1, 1).data;
    return { r: pixel[0], g: pixel[1], b: pixel[2] };
  }

  async function sendToVercelAPI() {
    document.getElementById('corr-status-badge').innerText = "РАСЧЕТ НА СЕРВЕРЕ...";
    document.getElementById('corr-status-badge').className = "status-badge badge-wait";

    try {
      const response = await fetch('https://colormatchpro-two.vercel.app/api/calibrate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state)
      });

      const result = await response.json();

      if (result.success) {
        const corr = result.corrected;
        const corrValElem = document.getElementById('corr-match-val');
        const corrBadgeElem = document.getElementById('corr-status-badge');

        corrValElem.innerText = `${corr.matchPercent}% MATCH`;
        corrBadgeElem.innerText = corr.statusText;

        if (corr.isMatch) {
          corrValElem.className = "match-val match-green";
          corrBadgeElem.className = "status-badge badge-green";
        } else {
          corrValElem.className = "match-val match-red";
          corrBadgeElem.className = "status-badge badge-red";
        }

        document.getElementById('corr-ref-swatch').style.backgroundColor = `rgb(${corr.refRgb.r}, ${corr.refRgb.g}, ${corr.refRgb.b})`;
        document.getElementById('corr-sam-swatch').style.backgroundColor = `rgb(${corr.samRgb.r}, ${corr.samRgb.g}, ${corr.samRgb.b})`;
        document.getElementById('corr-ref-rgb').innerText = `${corr.refRgb.r}, ${corr.refRgb.g}, ${corr.refRgb.b}`;
        document.getElementById('corr-sam-rgb').innerText = `${corr.samRgb.r}, ${corr.samRgb.g}, ${corr.samRgb.b}`;
      }
    } catch (err) {
      console.error("Ошибка API Vercel:", err);
      document.getElementById('corr-status-badge').innerText = "ОШИБКА API";
      document.getElementById('corr-status-badge').className = "status-badge badge-red";
    }
  }
</script>

</body>
</html>
