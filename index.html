<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLORMATCH - Сравнение Методов Коррекции</title>
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady()"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-purple: #7f00ff;
      --accent-green: #00ff87;
      --text-main: #f0f4f8;
      --text-sub: #8a99ad;
      --border: #1e2d4a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.2rem; font-weight: 800; background: linear-gradient(45deg, var(--accent-cyan), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
    .status { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: rgba(0,242,254,0.1); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

    .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; position: relative; }
    .card-title { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); display: flex; justify-content: space-between; }
    
    .view-box { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 8px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
    .view-box canvas { width: 100%; height: 100%; object-fit: contain; }
    
    .btn { background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple)); color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .btn-alt { background: linear-gradient(45deg, #00c6ff, #0072ff); }

    .data-list { font-size: 0.75rem; display: flex; flex-direction: column; gap: 4px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; }
    .data-item { display: flex; justify-content: space-between; align-items: center; }
    .data-label { color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .results-section { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid var(--border); }
    .section-title { font-size: 0.9rem; font-weight: 700; text-align: center; margin-bottom: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
    
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .method-card { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border: 1px solid var(--border); text-align: center; display: flex; flex-direction: column; gap: 6px; }
    .method-name { font-size: 0.7rem; color: var(--text-sub); font-weight: 700; }
    .match-percent { font-size: 1.8rem; font-weight: 900; color: var(--accent-green); }
    .match-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; background: rgba(0,255,135,0.15); color: var(--accent-green); display: inline-block; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/></svg>
      COLORMATCH
    </div>
    <div class="status" id="status-badge">Загрузка OpenCV...</div>
  </header>

  <div class="cards-grid">
    <!-- ЭТАЛОН -->
    <div class="card">
      <div class="card-title">1. ЭТАЛОН <span>01</span></div>
      <div class="view-box">
        <canvas id="canvas-etalon"></canvas>
      </div>
      <button class="btn" onclick="document.getElementById('file-etalon').click()">📷 Снять Эталон</button>
      <input type="file" id="file-etalon" accept="image/*" onchange="handleImageUpload(event, 'etalon')">
      
      <div class="data-list" id="data-etalon">
        <div class="data-item"><span class="data-label"><span class="dot" style="background:#e07a5f"></span>Цель:</span> <b id="e-target">RGB -,-,-</b></div>
        <div class="data-item"><span class="data-label"><span class="dot" style="background:#fff"></span>Белый:</span> <span id="e-white">-,-,-</span></div>
        <div class="data-item"><span class="data-label"><span class="dot" style="background:#888"></span>Серый:</span> <span id="e-gray">-,-,-</span></div>
        <div class="data-item"><span class="data-label"><span class="dot" style="background:#222"></span>Чёрный:</span> <span id="e-black">-,-,-</span></div>
        <div class="data-item"><span class="data-label"><span class="dot" style="background:#00b4d8"></span>Циан:</span> <span id="e-cyan">-,-,-</span></div>
      </div>
    </div>

    <!-- ОБРАЗЕЦ -->
    <div class="card">
      <div class="card-title">2. ОБРАЗЕЦ <span>02</span></div>
      <div class="view-box">
        <canvas id="canvas-sample"></canvas>
      </div>
      <button class="btn btn-alt" onclick="document.getElementById('file-sample').click()">📷 Снять Образец</button>
      <input type="file" id="file-sample" accept="image/*" onchange="handleImageUpload(event, 'sample')">

      <div class="data-list" id="data-sample">
        <div class="data-item"><span class="data-label"><span class="dot" style="background:#e07a5f"></span>Цель:</span> <b id="s-target">RGB -,-,-</b></div>
        <div class="data-item"><span class="data-label"><span class="dot" style="background:#fff"></span>Белый:</span> <span id="s-white">-,-,-</span></div>
        <div class="data-item"><span class="data-label"><span class="dot" style="background:#888"></span>Серый:</span> <span id="s-gray">-,-,-</span></div>
        <div class="data-item"><span class="data-label"><span class="dot" style="background:#222"></span>Чёрный:</span> <span id="s-black">-,-,-</span></div>
        <div class="data-item"><span class="data-label"><span class="dot" style="background:#00b4d8"></span>Циан:</span> <span id="s-cyan">-,-,-</span></div>
      </div>
    </div>
  </div>

  <div class="results-section">
    <div class="section-title">✨ Сравнение методов коррекции</div>
    <div class="comparison-grid">
      <div class="method-card">
        <div class="method-name">СТАРАЯ КОРРЕКЦИЯ</div>
        <div class="match-percent" id="old-match">--%</div>
        <div><span class="match-badge" id="old-status">НЕТ ДАННЫХ</span></div>
      </div>
      <div class="method-card">
        <div class="method-name">НОВАЯ КОРРЕКЦИЯ</div>
        <div class="match-percent" id="new-match">--%</div>
        <div><span class="match-badge" id="new-status">НЕТ ДАННЫХ</span></div>
      </div>
    </div>
  </div>
</div>

<script>
let cvReady = false;
const processedData = { etalon: null, sample: null };

function onOpenCvReady() {
  cvReady = true;
  document.getElementById('status-badge').innerText = 'Готов к работе';
  document.getElementById('status-badge').style.borderColor = 'var(--accent-green)';
  document.getElementById('status-badge').style.color = 'var(--accent-green)';
}

function handleImageUpload(e, type) {
  if (!e.target.files[0]) return;
  const img = new Image();
  img.onload = () => {
    processCard(img, type);
  };
  img.src = URL.createObjectURL(e.target.files[0]);
}

// ДОРАБОТАННЫЙ АЛГОРИТМ ЗАХВАТА КАРТОЧКИ (С ЗАЩИТОЙ ОТ ТЕКСТУРЫ И ТЕНЕЙ)
function processCard(imgElement, type) {
  if (!cvReady) return;

  const canvas = document.getElementById(`canvas-${type}`);
  const ctx = canvas.getContext('2d');
  canvas.width = imgElement.width;
  canvas.height = imgElement.height;
  ctx.drawImage(imgElement, 0, 0);

  let src = cv.imread(canvas);
  let gray = new cv.Mat();
  let blurred = new cv.Mat();
  let edges = new cv.Mat();
  let dilated = new cv.Mat();
  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();

  // 1. Предварительная фильтрация шума и дерева
  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0); // Подавляет текстуру дерева
  
  // 2. Мягкий Canny-детектор
  cv.Canny(blurred, edges, 30, 120);

  // 3. Морфологическое утолщение контуров (соединяем разрывы от теней)
  let M = cv.Mat.ones(3, 3, cv.CV_8U);
  cv.dilate(edges, dilated, M);

  // 4. Поиск внешних контуров
  cv.findContours(dilated, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  let bestCardQuad = null;
  let maxArea = 0;
  const imgArea = src.cols * src.rows;

  for (let i = 0; i < contours.size(); ++i) {
    let cnt = contours.get(i);
    let area = cv.contourArea(cnt);

    // Смягчен порог по площади: карточка может занимать от 3% до 95% кадра
    if (area < imgArea * 0.03 || area > imgArea * 0.95) continue;

    let peri = cv.arcLength(cnt, true);
    let approx = new cv.Mat();
    cv.approxPolyDP(cnt, approx, 0.025 * peri, true);

    if (approx.rows === 4 && cv.isContourConvex(approx)) {
      if (area > maxArea) {
        maxArea = area;
        bestCardQuad = approx.clone();
      }
    }
    approx.delete();
  }

  let finalMat = new cv.Mat();

  if (bestCardQuad) {
    // ВЫПРЯМЛЕНИЕ ПЕРСПЕКТИВЫ (Карточка найдена!)
    let pts = [];
    for (let i = 0; i < 4; i++) {
      pts.push({ x: bestCardQuad.data32S[i * 2], y: bestCardQuad.data32S[i * 2 + 1] });
    }
    
    // Сортировка точек: top-left, top-right, bottom-right, bottom-left
    pts.sort((a, b) => a.y - b.y);
    let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
    let bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);
    let sortedPts = [top[0], top[1], bottom[1], bottom[0]];

    let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
      sortedPts[0].x, sortedPts[0].y,
      sortedPts[1].x, sortedPts[1].y,
      sortedPts[2].x, sortedPts[2].y,
      sortedPts[3].x, sortedPts[3].y
    ]);

    let w = 800, h = 500; // Пропорции карточки
    let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, w, 0, w, h, 0, h]);
    let M_warp = cv.getPerspectiveTransform(srcTri, dstTri);
    
    cv.warpPerspective(src, finalMat, M_warp, new cv.Size(w, h));

    srcTri.delete(); dstTri.delete(); M_warp.delete();
  } else {
    // FALLBACK (Если контур потерян, берем центр кадра без выравнивания)
    finalMat = src.clone();
  }

  cv.imshow(canvas, finalMat);

  // Считывание RGB маркеров
  extractColors(finalMat, type);

  // Очистка памяти OpenCV
  src.delete(); gray.delete(); blurred.delete(); edges.delete();
  dilated.delete(); M.delete(); contours.delete(); hierarchy.delete();
  if (bestCardQuad) bestCardQuad.delete();
  finalMat.delete();
}

function extractColors(mat, type) {
  const w = mat.cols;
  const h = mat.rows;

  // Относительные координаты плашек на карточке
  const points = {
    target: { x: Math.round(w * 0.50), y: Math.round(h * 0.36) },
    white:  { x: Math.round(w * 0.16), y: Math.round(h * 0.33) },
    gray:   { x: Math.round(w * 0.16), y: Math.round(h * 0.62) },
    black:  { x: Math.round(w * 0.16), y: Math.round(h * 0.82) },
    cyan:   { x: Math.round(w * 0.84), y: Math.round(h * 0.68) }
  };

  const colors = {};
  for (let key in points) {
    colors[key] = getAverageRGB(mat, points[key].x, points[key].y, 6);
  }

  processedData[type] = colors;

  // Обновление UI
  const prefix = type === 'etalon' ? 'e' : 's';
  document.getElementById(`${prefix}-target`).innerText = `RGB ${colors.target.join(', ')}`;
  document.getElementById(`${prefix}-white`).innerText = colors.white.join(', ');
  document.getElementById(`${prefix}-gray`).innerText = colors.gray.join(', ');
  document.getElementById(`${prefix}-black`).innerText = colors.black.join(', ');
  document.getElementById(`${prefix}-cyan`).innerText = colors.cyan.join(', ');

  calculateMatches();
}

function getAverageRGB(mat, cx, cy, r) {
  let rSum = 0, gSum = 0, bSum = 0, count = 0;
  for (let x = cx - r; x <= cx + r; x++) {
    for (let y = cy - r; y <= cy + r; y++) {
      if (x >= 0 && x < mat.cols && y >= 0 && y < mat.rows) {
        let pixel = mat.ucharPtr(y, x);
        rSum += pixel[0];
        gSum += pixel[1];
        bSum += pixel[2];
        count++;
      }
    }
  }
  return [Math.round(rSum / count), Math.round(gSum / count), Math.round(bSum / count)];
}

function calculateMatches() {
  if (!processedData.etalon || !processedData.sample) return;

  const e = processedData.etalon;
  const s = processedData.sample;

  // Пример условного расчёта процентов для дефрагментации UI
  let diffOld = Math.abs(e.target[0] - s.target[0]) + Math.abs(e.target[1] - s.target[1]) + Math.abs(e.target[2] - s.target[2]);
  let matchOld = Math.max(0, Math.min(100, Math.round(100 - (diffOld / 7.65))));

  let diffNew = Math.abs((e.target[0] - e.gray[0]) - (s.target[0] - s.gray[0]));
  let matchNew = Math.max(0, Math.min(100, Math.round(98 - (diffNew / 5))));

  document.getElementById('old-match').innerText = `${matchOld}%`;
  document.getElementById('new-match').innerText = `${matchNew}%`;

  document.getElementById('old-status').innerText = matchOld > 80 ? 'ТОТ САМЫЙ ЦВЕТ' : 'СОВСЕМ НЕ ТОТ';
  document.getElementById('new-status').innerText = matchNew > 80 ? 'ТОТ САМЫЙ ЦВЕТ' : 'СОВСЕМ НЕ ТОТ';
}
</script>
</body>
</html>
