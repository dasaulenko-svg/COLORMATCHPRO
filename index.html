<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOSUCHTILE — Precision Color Calibration</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b26;
            --card-border: #232a3b;
            --accent-cyan: #00f2fe;
            --accent-purple: #7928ca;
            --accent-blue: #4facfe;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --status-green: #00e676;
            --pro-gold: #ffd700;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Шапка с кликабельным логотипом для PRO */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 4px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            position: relative;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
            transition: transform 0.1s ease;
        }

        .logo-container:active .logo-icon {
            transform: scale(0.92);
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
        }

        .logo-title-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Бейдж PRO (скрыт в Lite) */
        .pro-badge {
            display: none;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 140, 0, 0.2));
            border: 1px solid var(--pro-gold);
            color: var(--pro-gold);
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
            animation: fadeIn 0.3s ease;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--status-green);
            font-weight: 600;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--status-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--status-green);
        }

        /* Сетка снимков */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 4/3;
            background: #0f131a;
            border-radius: 10px;
            border: 1px dashed #2d3748;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), #4a00e0);
            color: white;
            box-shadow: 0 4px 12px rgba(121, 40, 202, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #000;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.2);
        }

        /* Блок PRO-данных (полностью скрыт по умолчанию) */
        .pro-only {
            display: none;
        }

        .pro-data-panel {
            flex-direction: column;
            gap: 4px;
            font-size: 11px;
            color: var(--text-secondary);
            font-family: monospace;
            margin-top: 4px;
            padding-top: 8px;
            border-top: 1px dashed var(--card-border);
            animation: fadeIn 0.3s ease;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* Карточка Вердикта */
        .verdict-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .verdict-header {
            font-size: 12px;
            font-weight: 700;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .verdict-result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f131a;
            padding: 16px;
            border-radius: 12px;
        }

        .verdict-match-badge {
            font-size: 26px;
            font-weight: 800;
            color: var(--status-green);
        }

        /* Класс-активатор PRO-режима */
        body.pro-mode-active .pro-badge {
            display: inline-block;
        }

        body.pro-mode-active .pro-only {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- ХЕДЕР -->
    <div class="header">
        <div class="logo-container" id="logoTrigger">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/>
                    <circle cx="12" cy="12" r="3"/>
                    <line x1="12" y1="1" x2="12" y2="5"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="1" y1="12" x2="5" y2="12"/>
                    <line x1="19" y1="12" x2="23" y2="12"/>
                </svg>
            </div>
            <div class="logo-title-group">
                <div class="logo-text">NOSUCHTILE</div>
                <div class="pro-badge">PRO</div>
            </div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Готов</span>
        </div>
    </div>

    <!-- СЕТКА КАРТОЧЕК (LITE по умолчанию) -->
    <div class="grid">
        <!-- 1. ЭТАЛОН -->
        <div class="step-card">
            <div class="step-title">
                <span>1. ЭТАЛОН</span>
                <span>01</span>
            </div>
            <div class="preview-box">
                <span style="color: var(--text-secondary); font-size: 11px;">[ Кадр ]</span>
            </div>
            <button class="btn-action btn-primary">
                📷 Снять
            </button>
            
            <!-- Появляется только в PRO -->
            <div class="pro-only pro-data-panel">
                <div class="color-row"><div class="color-dot" style="background:#4285f4"></div> LAB: 87, 136, 88</div>
                <div class="color-row"><div class="color-dot" style="background:#fff"></div> W: 236, 128, 126</div>
                <div class="color-row"><div class="color-dot" style="background:#000"></div> K: 97, 129, 125</div>
            </div>
        </div>

        <!-- 2. ОБРАЗЕЦ -->
        <div class="step-card">
            <div class="step-title">
                <span>2. ОБРАЗЕЦ</span>
                <span>02</span>
            </div>
            <div class="preview-box">
                <span style="color: var(--text-secondary); font-size: 11px;">[ Кадр ]</span>
            </div>
            <button class="btn-action btn-secondary">
                📷 Снять
            </button>
            
            <!-- Появляется только в PRO -->
            <div class="pro-only pro-data-panel">
                <div class="color-row"><div class="color-dot" style="background:#4285f4"></div> LAB: 87, 136, 88</div>
                <div class="color-row"><div class="color-dot" style="background:#fff"></div> W: 243, 128, 127</div>
                <div class="color-row"><div class="color-dot" style="background:#000"></div> K: 101, 129, 123</div>
            </div>
        </div>
    </div>

    <!-- ВЕРДИКТ (LITE по умолчанию) -->
    <div class="verdict-card">
        <div class="verdict-result-row">
            <div style="display:flex; flex-direction:column; gap:4px;">
                <span style="font-size:16px; font-weight:700;">Совпадение цвета</span>
                
                <!-- PRO Метрика (скрыта в Lite) -->
                <div class="pro-only" style="color: var(--accent-cyan); font-weight:bold; font-size:11px; margin-top:4px;">
                    ΔE (CIELAB) = 0.42 • Ensemble Mode
                </div>
            </div>
            <div class="verdict-match-badge">100%</div>
        </div>
    </div>

</div>

<script>
    let tapCount = 0;
    let tapTimer = null;
    const logoTrigger = document.getElementById('logoTrigger');

    logoTrigger.addEventListener('click', () => {
        tapCount++;
        clearTimeout(tapTimer);
        
        if (tapCount === 3) {
            document.body.classList.toggle('pro-mode-active');
            
            // Легкая вибрация при активации PRO
            if (navigator.vibrate) {
                navigator.vibrate([30, 50, 30]);
            }
            
            tapCount = 0;
        } else {
            tapTimer = setTimeout(() => {
                tapCount = 0;
            }, 400);
        }
    });
</script>

</body>
</html>
