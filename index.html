<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorMatchPro — Калибровка и Сравнение</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #121214;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 15px;
            background-color: #1a1a1e;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 1px solid #2a2a30;
            color: #4dabf7;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas.overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #2b2b36;
            color: #fff;
            transition: background 0.2s;
        }
        button:active { opacity: 0.8; }
        button.primary { background-color: #228be6; }
        button.success { background-color: #40c057; }
        button.danger { background-color: #fa5252; grid-column: span 2; }
        
        .slider-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a1a1e;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .slider-box input { flex: 1; }

        #resultDiv {
            margin-top: 10px;
            width: 100%;
        }
        .status-msg {
            text-align: center;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
    <!-- Подключение OpenCV.js -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
</head>
<body>

<header>ColorMatchPro™ Calibration</header>

<div class="container">
    <div class="video-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvasOverlay" class="overlay"></canvas>
    </div>

    <div class="controls">
        <div class="slider-box">
            <label for="evSlider">Экспозиция (EV):</label>
            <input type="range" id="evSlider" min="-2" max="2" step="0.1" value="0">
            <span id="evVal">0</span>
        </div>

        <div class="btn-group">
            <button id="btnRef" class="primary">1. Снять Эталон</button>
            <button id="btnSam" class="success">2. Снять Образец</button>
            <button id="btnClear" class="danger">Сбросить данные</button>
        </div>
    </div>

    <div id="status" class="status-msg">Загрузка OpenCV.js...</div>
    <div id="resultDiv"></div>
</div>

<script>
    const SERVER_URL = 'https://colormatchpro-two.vercel.app/api/calibrate';
    
    let video = document.getElementById('webcam');
    let overlay = document.getElementById('canvasOverlay');
    let statusDiv = document.getElementById('status');
    let evSlider = document.getElementById('evSlider');
    let evVal = document.getElementById('evVal');

    let cvReady = false;
    let track = null;

    // Геометрические параметры карты (в пикселях нормализованной модели)
    const CARD_W = 856;
    const CARD_H = 540;

    // Чистая относительная геометрия центров плашек
    const colorPatches = [
        { key: 'white',   x: Math.round(CARD_W * 0.155), y: Math.round(CARD_H * 0.250) },
        { key: 'gray',    x: Math.round(CARD_W * 0.155), y: Math.round(CARD_H * 0.500) },
        { key: 'black',   x: Math.round(CARD_W * 0.155), y: Math.round(CARD_H * 0.750) },
        { key: 'cyan',    x: Math.round(CARD_W * 0.845), y: Math.round(CARD_H * 0.250) },
        { key: 'magenta', x: Math.round(CARD_W * 0.845), y: Math.round(CARD_H * 0.500) },
        { key: 'yellow',  x: Math.round(CARD_W * 0.845), y: Math.round(CARD_H * 0.750) }
    ];

    function onOpenCvReady() {
        cvReady = true;
        statusDiv.innerText = "Камера готова. Наведите прицел на карточку.";
        initCamera();
    }

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } },
                audio: false
            });
            video.srcObject = stream;
            track = stream.getVideoTracks()[0];

            // Настройка экспозиции, если поддерживается
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.exposureCompensation) {
                evSlider.min = capabilities.exposureCompensation.min;
                evSlider.max = capabilities.exposureCompensation.max;
                evSlider.step = capabilities.exposureCompensation.step;
                evSlider.addEventListener('input', () => {
                    evVal.innerText = evSlider.value;
                    track.applyConstraints({ advanced: [{ exposureCompensation: parseFloat(evSlider.value) }] });
                });
            } else {
                evSlider.disabled = true;
            }
        } catch (e) {
            statusDiv.innerText = "Ошибка доступа к камере: " + e.message;
        }
    }

    // Извлечение кадра строго из <video> во избежание сдвига пропорций
    function captureFrameMat() {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        return cv.imread(canvas);
    }

    // Обработка карты и считывание LAB данных
    function processCardData() {
        if (!cvReady) throw new Error("OpenCV еще не загрузился");

        let src = captureFrameMat();
        let gray = new cv.Mat();
        let blurred = new cv.Mat();
        let thresholded = new cv.Mat();
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();

        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
        cv.threshold(blurred, thresholded, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);

        cv.findContours(thresholded, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        let maxArea = 0;
        let bestApprox = null;

        for (let i = 0; i < contours.size(); ++i) {
            let cnt = contours.get(i);
            let area = cv.contourArea(cnt);
            if (area > 10000) {
                let peri = cv.arcLength(cnt, true);
                let approx = new cv.Mat();
                cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                if (approx.rows === 4 && area > maxArea) {
                    maxArea = area;
                    if (bestApprox) bestApprox.delete();
                    bestApprox = approx;
                } else {
                    approx.delete();
                }
            }
        }

        if (!bestApprox) {
            src.delete(); gray.delete(); blurred.delete(); thresholded.delete(); contours.delete(); hierarchy.delete();
            throw new Error("Калибровочная карта не найдена в кадре. Обеспечьте ровное освещение.");
        }

        // Выравнивание перспективы (Warp Perspective)
        let warped = new cv.Mat();
        let dsize = new cv.Size(CARD_W, CARD_H);
        
        // Сортировка углов (Top-Left, Top-Right, Bottom-Right, Bottom-Left)
        let pts = [];
        for (let i = 0; i < 4; i++) {
            pts.push({ x: bestApprox.data32S[i * 2], y: bestApprox.data32S[i * 2 + 1] });
        }
        pts.sort((a, b) => a.y - b.y);
        let topPts = pts.slice(0, 2).sort((a, b) => a.x - b.x);
        let botPts = pts.slice(2, 4).sort((a, b) => b.x - a.x);
        let sortedPts = [topPts[0], topPts[1], botPts[0], botPts[1]];

        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
            sortedPts[0].x, sortedPts[0].y,
            sortedPts[1].x, sortedPts[1].y,
            sortedPts[2].x, sortedPts[2].y,
            sortedPts[3].x, sortedPts[3].y
        ]);
        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, CARD_W, 0, CARD_W, CARD_H, 0, CARD_H]);
        let M = cv.getPerspectiveTransform(srcTri, dstTri);
        cv.warpPerspective(src, warped, M, dsize);

        // Конвертация в LAB пространство
        let labMat = new cv.Mat();
        cv.cvtColor(warped, labMat, cv.COLOR_RGBA2RGB);
        cv.cvtColor(labMat, labMat, cv.COLOR_RGB2Lab);

        // Функция считывания статистики региона
        function getRegionStats(mat, cx, cy, r) {
            let rect = new cv.Rect(cx - r, cy - r, r * 2, r * 2);
            let roi = mat.roi(rect);
            let mean = cv.mean(roi);
            
            roi.delete();
            return {
                mean: { L: mean[0], a: mean[1], b: mean[2] },
                median: { L: mean[0], a: mean[1], b: mean[2] } // Базовая подстановка
            };
        }

        // 1. Извлечение плашек
        let patchData = {};
        colorPatches.forEach(p => {
            let stats = getRegionStats(labMat, p.x, p.y, 15);
            patchData[p.key] = stats.mean;
        });

        // 2. Извлечение центральной цели (Cutout Window)
        let targetStats = getRegionStats(labMat, Math.round(CARD_W / 2), Math.round(CARD_H / 2), 25);

        // Очистка памяти OpenCV
        src.delete(); gray.delete(); blurred.delete(); thresholded.delete();
        contours.delete(); hierarchy.delete(); bestApprox.delete();
        srcTri.delete(); dstTri.delete(); M.delete(); warped.delete(); labMat.delete();

        return {
            target: targetStats,
            patches: patchData
        };
    }

    // Кнопка: Снять Эталон
    document.getElementById('btnRef').onclick = () => {
        try {
            const data = processCardData();
            localStorage.setItem('cmp_standard', JSON.stringify(data));
            statusDiv.innerText = "Эталон успешно сохранён!";
        } catch (e) {
            alert(e.message);
        }
    };

    // Кнопка: Снять Образец и отправить на сервер
    document.getElementById('btnSam').onclick = async () => {
        const stdRaw = localStorage.getItem('cmp_standard');
        if (!stdRaw) {
            alert("Сначала снимите и сохраните Эталон!");
            return;
        }

        try {
            const sampleData = processCardData();
            const standardData = JSON.parse(stdRaw);

            statusDiv.innerText = "Расчёт на сервере...";

            const response = await fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    standard: standardData,
                    sample: sampleData
                })
            });

            const resData = await response.json();
            if (resData.success) {
                document.getElementById('resultDiv').innerHTML = resData.htmlReport;
                statusDiv.innerText = "Расчёт завершён.";
            } else {
                alert("Ошибка сервера: " + resData.error);
            }
        } catch (e) {
            alert(e.message);
        }
    };

    // Кнопка: Очистка
    document.getElementById('btnClear').onclick = () => {
        localStorage.removeItem('cmp_standard');
        document.getElementById('resultDiv').innerHTML = '';
        statusDiv.innerText = "Данные сброшены.";
    };
</script>
</body>
</html>
